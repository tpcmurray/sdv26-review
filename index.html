<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel review</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Pixel review</h1>
  <div id="meta"></div>
  <div class="controls">
    <label>Zoom
      <select id="zoom">
        <option value="2">2×</option><option value="4">4×</option>
        <option value="6" selected>6×</option><option value="8">8×</option><option value="12">12×</option>
      </select>
    </label>
    <label>Background
      <select id="bg">
        <option value="checker" selected>checker</option><option value="dark">dark</option>
        <option value="light">light</option><option value="sea">sea</option>
      </select>
    </label>
    <label><input type="checkbox" id="play" checked> play animations</label>
  </div>
  <nav id="tabs" class="tabs"></nav>
  <nav id="toc"></nav>
</header>
<main id="main"></main>
<footer>Give feedback in chat using asset ids (e.g. “obj.punt: hull too pale”). Approved items get recorded there.</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
